# ============================================================
# VivaAI — Hardened Production Docker Compose Configuration
# ============================================================
# Key Production Security Controls:
# 1. Internal databases (PostgreSQL, Redis, MinIO) do NOT expose host ports.
# 2. Production images use pinned tags (no floating :latest).
# 3. No dev reload (--reload flag removed); uvicorn runs with 4 production workers.
# 4. MinIO audio bucket is strictly private (anonymous download is set to none).
# 5. Non-root user execution in frontend containers.
# 6. APP_ENV=production enforces strong SECRET_KEY and blocks demo credentials.
# ============================================================

services:
  # ── PostgreSQL Database (Internal only) ───────────────────
  postgres:
    image: postgres:16.4-alpine3.20
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivaai-internal

  # ── Redis Cache & Broker (Internal only) ───────────────────
  redis:
    image: redis:7.4.0-alpine3.20
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-""}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vivaai-internal

  # ── MinIO Audio Storage (Internal only) ───────────────────
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - vivaai-internal

  # ── Private Audio Bucket Initializer ───────────────────────
  minio-init:
    image: minio/mc:RELEASE.2024-07-31T15-58-05Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/${MINIO_BUCKET:-vivaai-audio};
        mc anonymous set none local/${MINIO_BUCKET:-vivaai-audio};
        exit 0;
      "
    networks:
      - vivaai-internal

  # ── Production FastAPI Backend ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env.production
    environment:
      APP_ENV: production
      SCORING_WORKER_ENABLED: "false"
      MOCK_MODE: "false"
      DEBUG: "false"
      DEMO_MODE: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      S3_ENDPOINT_URL: http://minio:9000
      CORS_ORIGINS: ${CORS_ORIGINS:-https://student.university.edu,https://faculty.university.edu}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - vivaai-internal
      - vivaai-public

  # ── Background Worker (Celery) ────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.production
    environment:
      APP_ENV: production
      MOCK_MODE: "false"
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      S3_ENDPOINT_URL: http://minio:9000
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    networks:
      - vivaai-internal

  scoring-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env.production
    environment:
      APP_ENV: production
      MOCK_MODE: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: python -m app.workers.scoring_worker
    networks:
      - vivaai-internal
      - vivaai-public

  # ── Student Web Application (Port 3000) ───────────────────
  student-web:
    build:
      context: .
      dockerfile: apps/student-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.university.edu}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.university.edu}
        NEXT_PUBLIC_STUDENT_URL: ${NEXT_PUBLIC_STUDENT_URL:-https://student.university.edu}
        NEXT_PUBLIC_FACULTY_URL: ${NEXT_PUBLIC_FACULTY_URL:-https://faculty.university.edu}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.university.edu}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.university.edu}
      NEXT_PUBLIC_FACULTY_URL: ${NEXT_PUBLIC_FACULTY_URL:-https://faculty.university.edu}
      NEXT_PUBLIC_MOCK_MODE: "false"
    ports:
      - "3000:3000"
    networks:
      - vivaai-public
      - vivaai-internal

  # ── Faculty Review Web Application (Port 3001) ────────────
  faculty-web:
    build:
      context: .
      dockerfile: apps/faculty-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.university.edu}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.university.edu}
        NEXT_PUBLIC_STUDENT_URL: ${NEXT_PUBLIC_STUDENT_URL:-https://student.university.edu}
        NEXT_PUBLIC_FACULTY_URL: ${NEXT_PUBLIC_FACULTY_URL:-https://faculty.university.edu}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.university.edu}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.university.edu}
      NEXT_PUBLIC_STUDENT_URL: ${NEXT_PUBLIC_STUDENT_URL:-https://student.university.edu}
      NEXT_PUBLIC_MOCK_MODE: "false"
    ports:
      - "3001:3001"
    networks:
      - vivaai-public
      - vivaai-internal

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  vivaai-internal:
    internal: true
  vivaai-public:
    driver: bridge
